<article class="post-card">{{ with .Params.image }}<a class="card-image" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img{{ if eq $.Params.image_focus "upper" }} class="image-focus-upper"{{ end }} src="{{ strings.TrimPrefix "/" . | relURL }}" alt="" loading="lazy" width="640" height="360"></a>{{ end }}<div class="card-body"><p class="eyebrow">{{ .Date.Format "2 January 2006" }}{{ with .Params.author }} · {{ . }}{{ end }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p class="card-summary">{{ .Description | default (.Summary | plainify | truncate 220) }}</p><a class="read-more" href="{{ .RelPermalink }}">Read the story <span aria-hidden="true">→</span></a></div></article>
