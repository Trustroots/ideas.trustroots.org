{{ define "main" }}
<div class="blog-layout"><section class="blog-feed">
<h1>{{ .Title }}</h1>{{ .Content }}
{{ $pager := .Paginate .Pages.ByDate.Reverse }}
<div class="post-grid">{{ range $pager.Pages }}{{ partial "post-card.html" . }}{{ end }}</div>
{{ template "_internal/pagination.html" . }}
</section>{{ partial "sidebar.html" . }}</div>
{{ end }}
