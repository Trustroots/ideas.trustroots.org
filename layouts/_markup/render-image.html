{{- $url := .Destination -}}
{{- if and (strings.HasPrefix $url "/") (not (strings.HasPrefix $url "//")) -}}
  {{- $url = relURL (strings.TrimPrefix "/" $url) -}}
{{- end -}}
<img src="{{ $url | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
