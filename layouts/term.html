{{ define "main" }}<div class="blog-layout"><section class="blog-feed"><a class="back-link" href="{{ printf "%s/" .Data.Plural | relURL }}">← All {{ .Data.Plural }}</a><h1>{{ .Title }}</h1>{{ .Content }}{{ $pager := .Paginate .Pages.ByDate.Reverse 10 }}<div class="post-grid">{{ range $pager.Pages }}{{ partial "post-card.html" . }}{{ end }}</div>{{ template "_internal/pagination.html" . }}</section>{{ partial "sidebar.html" . }}</div>{{ end }}
