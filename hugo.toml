baseURL = 'https://ideas.trustroots.org/'
locale = 'en'
title = 'Trustroots Ideas'
enableRobotsTXT = true

[outputs]
home = ['HTML', 'RSS', 'SearchIndex']

[outputFormats.SearchIndex]
mediaType = 'application/json'
baseName = 'search-index'
isPlainText = true
notAlternative = true

[params]
description = 'Stories, updates and ideas from the Trustroots community.'

[permalinks.page]
posts = '/:year/:month/:day/:slug/'

[pagination]
pagerSize = 12

[markup.goldmark.renderer]
unsafe = false
